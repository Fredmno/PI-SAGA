<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PI-SAGA — Character</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: #0b0d17;
    color: #e0dcd0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 20px;
  }
  .container {
    max-width: 480px;
    width: 100%;
  }

  / ─── CHARACTER CARD ─── /
  .charcard {
    background: linear-gradient(145deg, #14182a, #1a1f33);
    border: 1px solid #2a3055;
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 12px;
    box-shadow: 0 8px 32px rgba(0,0,0,.6);
  }
  .charmain {
    display: flex;
    gap: 16px;
    align-items: center;
  }
  .avatar {
    width: 90px;
    height: 90px;
    border-radius: 12px;
    border: 2px solid #3b4480;
    background: #0f1325;
    flex-shrink: 0;
    overflow: hidden;
  }
  .avatar img { width: 100%; height: 100%; object-fit: cover; }
  .charmain h2 { font-size: 1.3rem; }
  .charmain .class { color: #8892d0; font-size: .85rem; }
  .charmain .level { color: #c9a84c; font-weight: bold; }

  / ─── STAT BARS ─── /
  .statrow {
    margin-top: 14px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .bar {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: .8rem;
  }
  .bar .label { width: 30px; font-weight: bold; }
  .bar .track {
    flex: 1;
    height: 10px;
    background: #1e233f;
    border-radius: 6px;
    overflow: hidden;
  }
  .bar .fill {
    height: 100%;
    border-radius: 6px;
    transition: width .4s ease;
  }
  .hp .fill { background: linear-gradient(90deg, #bc3a3a, #e05858); }
  .xp .fill { background: linear-gradient(90deg, #3a7bbc, #58b0e0); }
  .bar .val { width: 48px; text-align: right; color: #aab; }

  .gold {
    margin-top: 10px;
    text-align: right;
    color: #e0b84c;
    font-weight: bold;
    font-size: .95rem;
  }

  / ─── EQUIPMENT ─── /
  .equips {
    display: flex;
    gap: 8px;
    margin-top: 12px;
    justify-content: center;
    flex-wrap: wrap;
  }
  .slot {
    width: 56px; height: 56px;
    background: #11162e;
    border: 1px dashed #334; border-radius: 10px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-size: .6rem; color: #556; gap: 2px;
  }
  .slot.has { border-style: solid; border-color: #3b4480; color: #c9d; }
  .slot .icon { font-size: 1.2rem; }
  .slot .iname { font-size: .55rem; }

  / ─── TABS ─── /
  .tabs {
    display: flex; gap: 4px; margin-bottom: 10px;
  }
  .tabs button {
    flex: 1; padding: 10px; background: #1a1f33; border: 1px solid #2a3055;
    border-radius: 10px 10px 0 0; color: #8892d0; font-weight: bold;
    cursor: pointer; transition: .2s;
  }
  .tabs button.active { background: #222b52; border-color: #3b4480; color: #fff; }
  .tabs button:hover { background: #232c55; }
  .panel { display: none; }
  .panel.active { display: block; }

  / ─── INVENTORY / SHOP GRID ─── /
  .grid {
    display: grid; grid-template-columns: repeat(4,1fr); gap: 8px;
  }
  .item {
    background: #14182a; border: 1px solid #2a3055; border-radius: 10px;

> ChatGPT:
padding: 10px 4px; text-align: center; cursor: pointer; transition: .2s;
    font-size: .7rem;
  }
  .item:hover { border-color: #4f5bb0; background: #1a1f38; }
  .item .iicon { font-size: 1.5rem; display: block; margin-bottom: 4px; }
  .item .iname { display: block; font-weight: bold; }
  .item .iprice { color: #e0b84c; font-size: .65rem; }
  .item .iqty { color: #8a9; font-size: .6rem; }
  .item button {
    margin-top: 6px; padding: 4px 10px; font-size: .65rem;
    background: #2a3055; border: 1px solid #3b4480; border-radius: 6px;
    color: #e0dcd0; cursor: pointer;
  }
  .item button:hover { background: #3b4480; }

  .empty { grid-column: 1/-1; text-align: center; color: #556; padding: 20px; }

  / ─── TOOLTIP ─── /
  .tooltip {
    display: none; position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: #0b0d17; border: 1px solid #3b4480; border-radius: 10px;
    padding: 10px 16px; max-width: 300px; color: #e0dcd0; font-size: .8rem;
    z-index: 999;
  }
  .tooltip.show { display: block; }
</style>
</head>
<body>

  <!-- ═══ TABS ═══ -->

    <button class="active" data-tab="inv">🎒 Inventory</button>
    <button data-tab="shop">🏪 Shop</button>

<script>
// ─── SAMPLE DATA ───
const STATE = {
  name: 'Blight',
  class: 'Shadowblade',
  level: 5,
  hp: 68, maxHp: 100,
  xp: 420, xpNext: 1000,
  gold: 245,
  equipment: {
    weapon: { name: 'Dusk Blade', icon: '🗡️', stats: 'ATK +12' },

> ChatGPT:
armor:  { name: 'Scale Mail', icon: '🛡️', stats: 'DEF +8' },
    head: null,
    boots: null,
    ring: null
  },
  inventory: [
    { id: 'p1', name: 'HP Potion', icon: '🧪', qty: 3, desc: 'Restore 30 HP', price: 15 },
    { id: 'p2', name: 'Mana Potion', icon: '🔮', qty: 1, desc: 'Restore 20 MP', price: 20 },
    { id: 'p3', name: 'Smoke Bomb', icon: '💨', qty: 2, desc: 'Escape battle', price: 30 },
    { id: 'p4', name: 'Antidote', icon: '🌿', qty: 1, desc: 'Cure poison', price: 12 },
    { id: 'p5', name: 'Fire Scroll', icon: '🔥', qty: 1, desc: 'Deal 40 fire dmg', price: 55 }
  ]
};

const SHOP_ITEMS = [
  { id: 's1', name: 'HP Potion', icon: '🧪', price: 15, desc: 'Restore 30 HP' },
  { id: 's2', name: 'Mana Potion', icon: '🔮', price: 20, desc: 'Restore 20 MP' },
  { id: 's3', name: 'Antidote', icon: '🌿', price: 12, desc: 'Cure poison' },
  { id: 's4', name: 'Iron Sword', icon: '⚔️', price: 120, desc: 'ATK +8' },
  { id: 's5', name: 'Leather Armor', icon: '🦺', price: 100, desc: 'DEF +5' },
  { id: 's6', name: 'Fire Scroll', icon: '🔥', price: 55, desc: '40 fire dmg' },
  { id: 's7', name: 'Smoke Bomb', icon: '💨', price: 30, desc: 'Escape battle' },
  { id: 's8', name: 'Silver Ring', icon: '💍', price: 200, desc: 'All stats +2' }
];

// ─── RENDER ───
function renderInv() {
  const g = document.getElementById('invGrid');
  if (!STATE.inventory.length) {
    g.innerHTML = 'Your bag is empty.
';
    return;
  }
  g.innerHTML = STATE.inventory.map(it => `

      ${it.icon}
      ${it.name}
      x${it.qty}

  `).join('');
}

function renderShop() {
  const g = document.getElementById('shopGrid');
  g.innerHTML = SHOP_ITEMS.map(it => `

      ${it.icon}
      ${it.name}
      💰${it.price}
      <button onclick="buyItem('${it.id}')">Buy</button>

  `).join('');
}

function buyItem(id) {
  const item = SHOP_ITEMS.find(i => i.id === id);
  if (!item) return;
  // check gold & update
  if (STATE.gold < item.price) {
    showTip(Not enough gold! Need ${item.price}💰);
    return;
  }
  STATE.gold -= item.price;
  // add to inventory
  const existing = STATE.inventory.find(i => i.name === item.name);
  if (existing) {
    existing.qty++;
  } else {
    STATE.inventory.push({ ...item, qty: 1 });
  }
  updateDisplay();
  showTip(Bought ${item.name}! (-${item.price}💰));
}

function showTip(msg) {
  const t = document.getElementById('tip');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._hide);
  t._hide = setTimeout(() => t.classList.remove('show'), 2500);
}

function updateDisplay() {
  document.getElementById('goldAmt').textContent = STATE.gold;
  document.getElementById('hpBar').style.width = (STATE.hp/STATE.maxHp*100)+'%';
  document.getElementById('hpTxt').textContent = STATE.hp+'/'+STATE.maxHp;
  document.getElementById('xpBar').style.width = (STATE.xp/STATE.xpNext*100)+'%';
  document.getElementById('xpTxt').textContent = STATE.xp+'/'+STATE.xpNext;
  renderInv();
  renderShop();
}

// ─── TABS ───
document.querySelectorAll('.tabs button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById(btn.dataset.tab+'Panel').classList.add('active');
  });
});

// ─── TOOLTIP ON HOVER ───
document.addEventListener('mouseover', e => {
  const item = e.target.closest('.item');
  const tip = document.getElementById('tip');
  if (!item) { tip.classList.remove('show'); return; }
  const desc = item.dataset.desc;
  if (desc) {
    tip.textContent = desc + (item.dataset.price ? ' · 💰'+item.dataset.price : '');
    tip.classList.add('show');
  }
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.item')) {
    document.getElementById('tip').classList.remove('show');
  }
});

// ─── INIT ───
updateDisplay();
</script>
</body>
</html>
